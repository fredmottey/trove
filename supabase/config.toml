project_id = "trove"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = false
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://127.0.0.1:8080/profile"]
jwt_expiry = 3600
# Invite-only: nobody can self-register (GOTRUE_DISABLE_SIGNUP=true).
enable_signup = false
[auth.email]
# Despite the name, this toggles the whole email provider
# (GOTRUE_EXTERNAL_EMAIL_ENABLED). false would also block password sign-in.
# Account creation stays blocked by [auth].enable_signup above.
enable_signup = true
enable_confirmations = false
