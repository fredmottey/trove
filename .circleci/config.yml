version: 2.1
jobs:
  verify:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Use Node 22
          command: |
            source /opt/circleci/.nvm/nvm.sh
            nvm install 22
            nvm alias default 22
            echo 'source /opt/circleci/.nvm/nvm.sh' >> "$BASH_ENV"
            echo 'nvm use 22' >> "$BASH_ENV"
      - restore_cache:
          keys: ['npm-v1-{{ checksum "package-lock.json" }}']
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths: [~/.npm]
      - run: npm run lint && npm run typecheck && npm test
      - run: npx --no-install supabase start
      - run: npm run test:db
      - run: node scripts/test-local-env.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - run:
          name: Browser smoke tests against disposable database
          command: |
            source /tmp/trove-test-env
            npm run test:e2e
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results
      - run:
          when: always
          command: npx --no-install supabase stop --no-backup
  deploy:
    docker:
      - image: cimg/node:22.16
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run:
          name: Apply additive hosted migrations
          command: |
            npx --no-install supabase link --project-ref abkfayyocpyzhbdsvlbv
            npx --no-install supabase db push --yes --skip-vault
      - run:
          name: Deploy verified source to Vercel
          command: |
            npx --no-install vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx --no-install vercel build --prod --token="$VERCEL_TOKEN"
            npx --no-install vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
workflows:
  check-and-deploy:
    jobs:
      - verify
      - deploy:
          serial-group: << pipeline.project.slug >>/production
          context: trove-production
          requires: [verify]
          filters:
            branches:
              only: main
