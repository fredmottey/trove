# Trove CI: verify every pull request and every push to main, then deploy main.
#
#   static ─┬─► unit ─────────┐
#           ├─► supabase-db ──┼─► deploy (main only, environment: production)
#           └─► playwright ───┘
#   changes ─┘ (PRs only: decides whether supabase-db / playwright can be skipped)
#
# Third-party actions are pinned to full commit SHAs (tag kept in a comment) so a
# moved or compromised tag can never change what runs next to production secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

# PRs: a new push cancels the now-stale run for that branch.
# main: every commit gets its own group (github.sha), so nothing is cancelled there.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest: "latest" moved to
# 26.04, which Playwright 1.56 cannot install Chromium dependencies for. Bump this
# deliberately, together with Playwright.

env:
  # Containers Trove never uses locally. Skipping them makes `supabase start`
  # faster; we keep postgres (always on), gotrue (auth), postgrest (API) and kong (gateway).
  SUPABASE_EXCLUDE: realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

jobs:
  # ── Fast gate: no database, no browser. Everything else waits on this. ──
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm # caches ~/.npm keyed on package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ── Path filter ("predictive" test selection). Only meaningful on PRs. ──
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      db: ${{ steps.db.outputs.relevant }}
      e2e: ${{ steps.e2e.outputs.relevant }}
    steps:
      # Allow-list: the database tests only exercise supabase/.
      - id: db
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'supabase/**'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
      # Deny-list: run Playwright unless EVERY changed file is known-irrelevant.
      # With predicate-quantifier 'every', a file counts only if it matches all
      # patterns, i.e. it is inside the repo and outside every '!' exclusion.
      - id: e2e
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            relevant:
              - '**'
              - '!**/*.md'
              - '!supabase/tests/**'
              - '!tests/*.test.ts'
              - '!.circleci/**'

  unit:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Passing --reporter replaces the defaults, so we list all three:
      # default = readable log, github-actions = inline PR annotations, junit = summary data.
      - run: npm test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/vitest.xml
      - name: Test summary
        if: always() && hashFiles('reports/vitest.xml') != ''
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: reports/vitest.xml

  supabase-db:
    needs: [static, changes]
    # `changes` is skipped on push, so we must say "run even if a need was skipped"
    # (!cancelled() && static succeeded), then apply the path filter on PRs only.
    if: >-
      !cancelled() && needs.static.result == 'success' &&
      (github.event_name == 'push' || needs.changes.outputs.db == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners ship with Docker, which the Supabase CLI drives.
      - run: npx --no-install supabase start -x "$SUPABASE_EXCLUDE"
      - run: npm run test:db
      # No `supabase stop`: the runner VM is thrown away after the job.

  playwright:
    needs: [static, changes]
    if: >-
      !cancelled() && needs.static.result == 'success' &&
      (github.event_name == 'push' || needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browser binaries are ~150 MB; cache them per Playwright version.
      - id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      # Downloads Chromium only on a cache miss, but always installs OS libraries.
      - run: npx --no-install playwright install --with-deps chromium
      # The private-library tests log in as a disposable user in a local stack.
      - run: npx --no-install supabase start -x "$SUPABASE_EXCLUDE"
      - run: node scripts/test-local-env.mjs
      # Sourcing and testing in one step: shell variables don't survive between steps.
      - name: Browser smoke tests against disposable database
        run: |
          source /tmp/trove-test-env
          npm run test:e2e
      - name: Test summary
        if: always() && hashFiles('reports/playwright.xml') != ''
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: reports/playwright.xml
      - name: Flaky and slow test insights
        if: always() && hashFiles('reports/playwright.json') != ''
        run: node scripts/ci-test-insights.mjs reports/playwright.json
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  deploy:
    needs: [static, unit, supabase-db, playwright]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Secrets live on this environment, which only main may deploy to.
    environment:
      name: production
      url: https://trove.fredmottey.dev
    # One deploy at a time, never cancelled mid-migration. If several queue up,
    # GitHub keeps only the newest pending one, so the latest commit wins.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Migrations first: they are additive, so the currently live frontend keeps
      # working against the new schema until the new frontend replaces it.
      - name: Apply additive hosted migrations
        run: |
          npx --no-install supabase link --project-ref pmydadqtvfmgnbjklwam
          npx --no-install supabase db push --yes --skip-vault
      # Build on the runner and upload the result, so what ships is exactly the
      # commit that passed the checks above.
      - name: Deploy verified source to Vercel
        run: |
          npx --no-install vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --no-install vercel build --prod --token="$VERCEL_TOKEN"
          npx --no-install vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
